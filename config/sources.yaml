  programme: iai
  text_layer: native
  pages: 26
  layout: pages
  sentence_markers: false
  exclude_sections: [3, 4]
  notes: >
    Not binding. Has no § structure at all — modules are headed "Module: X" —
    so it is parsed one record per page rather than per provision. Accepted
    limitation: D4 loses every conflict against the statutes, so page-level
    granularity is sufficient for its role as the source cited against.
    Module IDs are XX0n0 placeholders and ambiguous across the two module
    groups. Thesis prerequisite names WIW. Sections 3–4 (qualification and
    competence matrices) excluded — no reliable row structure.
